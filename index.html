<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Future Finance Planner</title>
  <style>
    /* Apple-like clean interface */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f7;
      color: #1d1d1f;
    }
    header {
      background-color: #fff;
      padding: 20px 40px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 24px;
      font-weight: 600;
      margin: 0;
    }
    header nav button {
      margin-left: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 500;
      color: white;
      font-size: 14px;
    }
    .btn-primary { background-color: #0071e3; }
    .btn-secondary { background-color: #ff9500; }
    .btn-primary:hover { background-color: #005bb5; }
    .btn-secondary:hover { background-color: #cc7a00; }

    section {
      max-width: 900px;
      margin: 50px auto;
      padding: 40px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    h2 { margin-top: 0; }
    input, select {
      width: 100%;
      padding: 12px 16px;
      margin: 8px 0;
      border: 1px solid #d1d1d6;
      border-radius: 10px;
      font-size: 16px;
    }
    button.add-expense {
      background-color: #34c759;
      margin-top: 10px;
      width: auto;
    }
    button.add-expense:hover { background-color: #28a745; }
    .result, .suggestion {
      background-color: #f0f0f5;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }
    .goal-bar {
      background-color: #e0e0e0;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 10px;
    }
    .goal-bar-inner {
      height: 20px;
      background-color: #0071e3;
      width: 0%;
      text-align: center;
      color: white;
      line-height: 20px;
      font-size: 12px;
    }
    .car-bar-inner {
      height: 20px;
      background-color: #ff9500;
      width: 0%;
      text-align: center;
      color: white;
      line-height: 20px;
      font-size: 12px;
    }
    .expense-item { margin-bottom: 10px; }
  </style>
</head>
<body>

<header>
  <h1>Future Finance Planner</h1>
  <nav>
    <button class="btn-primary" onclick="scrollToSection('planner')">Planner</button>
    <button class="btn-secondary" onclick="scrollToSection('goals')">Goals</button>
  </nav>
</header>

<section id="landing">
  <h2>Welcome to Future Finance Planner</h2>
  <p>Plan your finances like Apple designs your technology: clean, intuitive, and smart. Budget, save, and track your goals with ease.</p>
  <button class="btn-primary" onclick="scrollToSection('planner')">Get Started</button>
</section>

<section id="planner">
  <h2>Financial Inputs</h2
